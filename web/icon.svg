<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Maps of Making network glyph, OHM edition: holographic foil. The strokes
     sweep the TTM spectrum with white sheen bands between hues (the foil
     catch-light), over a soft blurred halo of the same mark. -->
<svg
   viewBox="0 0 14 14"
   width="14"
   height="14"
   version="1.1"
   id="svg4"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs4">
    <linearGradient
       id="holo"
       gradientUnits="userSpaceOnUse"
       x1="1.9" y1="8.6" x2="12.1" y2="2.6">
      <stop offset="0"    stop-color="#09FFF0" />
      <stop offset="0.12" stop-color="#8ff7ff" />
      <stop offset="0.20" stop-color="#e9d5ff" />
      <stop offset="0.30" stop-color="#E904E5" />
      <stop offset="0.42" stop-color="#ff7ad9" />
      <stop offset="0.50" stop-color="#fff3b0" />
      <stop offset="0.60" stop-color="#a1ff00" />
      <stop offset="0.70" stop-color="#6ff7c9" />
      <stop offset="0.80" stop-color="#b18cff" />
      <stop offset="0.90" stop-color="#ffd08a" />
      <stop offset="1"    stop-color="#ff9500" />
    </linearGradient>
    <filter id="halo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.55" />
    </filter>
    <g id="mark">
      <circle
         cx="10.625213" cy="3.3747871" r="1.4500852"
         fill="none" stroke="url(#holo)"
         style="stroke-width:0.906303;stroke-linecap:butt;stroke-dasharray:none" />
      <circle
         cx="10.625213" cy="10.625213" r="1.4500852"
         fill="none" stroke="url(#holo)"
         style="stroke-width:0.906303;stroke-linecap:butt;stroke-dasharray:none" />
      <circle
         cx="3.3747871" cy="7" r="1.4500852"
         fill="none" stroke="url(#holo)"
         style="stroke-width:0.906303;stroke-linecap:butt;stroke-dasharray:none" />
      <line
         x1="9.4470186" y1="4.0091991" x2="4.5529814" y2="6.3655877"
         stroke="url(#holo)"
         style="stroke-width:0.906303;stroke-linecap:butt;stroke-dasharray:none" />
      <line
         x1="4.5529814" y1="7.6344123" x2="9.4470186" y2="9.9908009"
         stroke="url(#holo)"
         style="stroke-width:0.906303;stroke-linecap:butt;stroke-dasharray:none" />
    </g>
  </defs>
  <rect
     width="14"
     height="14"
     fill="#0d1117"
     id="rect1" />
  <use xlink:href="#mark" href="#mark" filter="url(#halo)" opacity="0.85" />
  <use xlink:href="#mark" href="#mark" />
</svg>
