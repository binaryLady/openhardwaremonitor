<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Maps of Making network glyph, OHM edition: iridescent pearl. The strokes
     sweep the pastel spectrum (coral, pale pink, periwinkle, ice blue, pale
     lime) over a soft halo, and the gradient itself drifts back and forth on
     an 8s ease loop — browsers that render live SVG favicons shimmer; the
     ico/png assets carry the static frame. -->
<svg viewBox="0 0 14 14" width="14" height="14" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- pearl spectrum, doubled so the shimmer can travel and wrap -->
    <linearGradient id="pearl" gradientUnits="userSpaceOnUse" x1="0" y1="12" x2="28" y2="0">
      <stop offset="0"    stop-color="#ff9a9e"/>
      <stop offset="0.10" stop-color="#fecfef"/>
      <stop offset="0.20" stop-color="#a1c4fd"/>
      <stop offset="0.30" stop-color="#c2e9fb"/>
      <stop offset="0.40" stop-color="#d4fc79"/>
      <stop offset="0.50" stop-color="#ff9a9e"/>
      <stop offset="0.60" stop-color="#fecfef"/>
      <stop offset="0.70" stop-color="#a1c4fd"/>
      <stop offset="0.80" stop-color="#c2e9fb"/>
      <stop offset="0.90" stop-color="#d4fc79"/>
      <stop offset="1"    stop-color="#ff9a9e"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="0 0; -14 0; 0 0" dur="8s" calcMode="spline"
        keySplines="0.42 0 0.58 1; 0.42 0 0.58 1" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="halo" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="0.4"/></filter>
    <g id="mark">
      <circle cx="10.625213" cy="3.3747871" r="1.4500852" fill="none" style="stroke-width:0.906303"/>
      <circle cx="10.625213" cy="10.625213" r="1.4500852" fill="none" style="stroke-width:0.906303"/>
      <circle cx="3.3747871" cy="7" r="1.4500852" fill="none" style="stroke-width:0.906303"/>
      <line x1="9.4470186" y1="4.0091991" x2="4.5529814" y2="6.3655877" style="stroke-width:0.906303"/>
      <line x1="4.5529814" y1="7.6344123" x2="9.4470186" y2="9.9908009" style="stroke-width:0.906303"/>
    </g>
  </defs>
  <rect width="14" height="14" fill="#0d1117"/>
  <use href="#mark" xlink:href="#mark" stroke="url(#pearl)" filter="url(#halo)" opacity="0.8"/>
  <use href="#mark" xlink:href="#mark" stroke="url(#pearl)"/>
</svg>
