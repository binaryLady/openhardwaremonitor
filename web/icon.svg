      <stop offset="0" stop-color="#09FFF0" />
      <stop offset="0.28" stop-color="#ff0080" />
      <stop offset="0.5" stop-color="#E904E5" />
      <stop offset="0.74" stop-color="#a1ff00" />
      <stop offset="1" stop-color="#ff9500" />
    </linearGradient>
  </defs>
  <rect
     width="14"
     height="14"
