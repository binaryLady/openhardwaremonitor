<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Maps of Making network glyph, OHM edition: true iridescence. Two crossing
     spectral sweeps — a jewel-tone base and a screen-blended interference
     sheen with narrow specular bands — over a tight glow halo. The color
     appears to shift across the mark, oil-film style. -->
<svg viewBox="0 0 14 14" width="14" height="14" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- base sweep: deep jewel spectral -->
    <linearGradient id="ga" gradientUnits="userSpaceOnUse" x1="1.5" y1="11.5" x2="12.5" y2="2.5">
      <stop offset="0"    stop-color="#00f5ff"/>
      <stop offset="0.26" stop-color="#7a3cff"/>
      <stop offset="0.55" stop-color="#E904E5"/>
      <stop offset="0.78" stop-color="#ff0080"/>
      <stop offset="1"    stop-color="#ff9500"/>
    </linearGradient>
    <!-- crossing interference sheen: narrow bright bands, screen-blended -->
    <linearGradient id="gb" gradientUnits="userSpaceOnUse" x1="3" y1="1.5" x2="11" y2="12.5">
      <stop offset="0"    stop-color="#a1ff00" stop-opacity="0.9"/>
      <stop offset="0.20" stop-color="#a1ff00" stop-opacity="0"/>
      <stop offset="0.33" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.40" stop-color="#09FFF0" stop-opacity="0"/>
      <stop offset="0.66" stop-color="#09FFF0" stop-opacity="0.95"/>
      <stop offset="0.80" stop-color="#09FFF0" stop-opacity="0"/>
      <stop offset="1"    stop-color="#ffd08a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="halo" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="0.35"/></filter>
    <g id="mark">
      <circle cx="10.625213" cy="3.3747871" r="1.4500852" fill="none" style="stroke-width:0.906303"/>
      <circle cx="10.625213" cy="10.625213" r="1.4500852" fill="none" style="stroke-width:0.906303"/>
      <circle cx="3.3747871" cy="7" r="1.4500852" fill="none" style="stroke-width:0.906303"/>
      <line x1="9.4470186" y1="4.0091991" x2="4.5529814" y2="6.3655877" style="stroke-width:0.906303"/>
      <line x1="4.5529814" y1="7.6344123" x2="9.4470186" y2="9.9908009" style="stroke-width:0.906303"/>
    </g>
  </defs>
  <rect width="14" height="14" fill="#0d1117"/>
  <use href="#mark" xlink:href="#mark" stroke="url(#ga)" filter="url(#halo)" opacity="0.75"/>
  <use href="#mark" xlink:href="#mark" stroke="url(#ga)"/>
  <use href="#mark" xlink:href="#mark" stroke="url(#gb)" style="mix-blend-mode:screen"/>
</svg>
