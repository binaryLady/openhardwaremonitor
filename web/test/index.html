<!doctype html>
<html lang="en" data-ttm-theme="ttm">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Design Stack — Test Bench</title>
<link rel="stylesheet" href="../ttm/tokens.css" />
<link rel="stylesheet" href="../ttm/components.css" />
<script src="../ttm/config.js"></script>
<script src="../vendor/supabase.js"></script>
<script src="../ttm/theme.js"></script>
<script src="../ttm/brand.js"></script>
<script src="../ttm/toast.js"></script>
<script src="../ttm/stack.js"></script>
<script src="../parse.js"></script>
<script src="../bridge.js"></script>
<script src="../gui-core.js"></script>
<script src="../feed.js"></script>
<script src="../demo-data.js"></script>
<script src="fixtures/data.sample.js"></script>
</head>
<body class="ttm-page">
<a class="ttm-skip" href="#main">Skip to content</a>
<main class="ttm-main" id="main" tabindex="-1">
  <header class="ttm-header">
    <h1>Stack <span class="gradient-text-rainbow">· test bench</span></h1>
    <span class="ttm-crumb">tokens · theming · toasts · gate · telemetry</span>
  </header>
  <section class="ttm-card full">
    <h2 class="ttm-card__title">Results <span class="ttm-badge" id="summary">running…</span></h2>
    <div class="ttm-tablewrap"><table class="ttm-table" id="results"></table></div>
  </section>
  <footer class="ttm-footer">stack self-test · everything runs local-only</footer>
</main>
<script>
window.addEventListener('load', function () {
  'use strict';
  var results = [];
  // pin mode: base-value assertions expect the ttm-dark root; restored at the end
  var prevMode = null;
  try { prevMode = localStorage.getItem('ttm_mode'); } catch (e) {}
  window.TTMTheme.setMode('dark');
  // strict: only `true` passes; any other return value is the failure detail
  // Assertions are synchronous by default; a test may return a promise
  // (the feed's read path is inherently async) and the report waits for it.
  var pending = [];
  function t(name, fn) {
    try {
      var v = fn();
      if (v && typeof v.then === 'function') {
        var rec = { name: name, ok: false, detail: 'pending' };
        results.push(rec);
        pending.push(v.then(function (r) {
          rec.ok = r === true;
          rec.detail = r === true ? '' : String(r);
        }, function (e) { rec.ok = false; rec.detail = e.message; }));
        return;
      }
      results.push({ name: name, ok: v === true, detail: v === true ? '' : String(v) });
    } catch (e) { results.push({ name: name, ok: false, detail: e.message }); }
  }
  function cssVar(name, el) {
    return getComputedStyle(el || document.documentElement).getPropertyValue(name).trim();
  }

  // ── tokens ────────────────────────────────────────────────────────────────
  t('tokens.css loaded (--ttm-pink = #E904E5)', function () {
    return cssVar('--ttm-pink').toLowerCase() === '#e904e5';
  });
  t('brand colors present (lime/cyan/hot-red/goldenrod)', function () {
    return ['--ttm-lime', '--ttm-cyan', '--ttm-hot-red', '--ttm-goldenrod']
      .every(function (v) { return cssVar(v) !== ''; });
  });
  t('components.css loaded (.ttm-card gets surface + border)', function () {
    var el = document.querySelector('.ttm-card');
    var cs = getComputedStyle(el);
    return cs.borderTopWidth !== '0px' && cs.backgroundColor !== 'rgba(0, 0, 0, 0)';
  });

  // ── theming ───────────────────────────────────────────────────────────────
  var bgTTM = cssVar('--ttm-bg');
  t('theme: ttm surfaces active under data-ttm-theme="ttm"', function () {
    return bgTTM !== '';
  });
  t('theme: terminal swaps surfaces', function () {
    document.documentElement.setAttribute('data-ttm-theme', 'terminal');
    var bg = cssVar('--ttm-bg');
    return bg !== '' && bg !== bgTTM ? true : 'terminal --ttm-bg=' + bg;
  });
  t('theme: no attribute falls back to :root palette', function () {
    // zine is a maps-site layer (ttm-theme.css); with tokens.css alone the
    // attribute-less state must resolve to the :root (ttm) palette
    document.documentElement.removeAttribute('data-ttm-theme');
    var bg = cssVar('--ttm-bg');
    document.documentElement.setAttribute('data-ttm-theme', 'ttm'); // restore
    return bg === bgTTM ? true : 'fallback --ttm-bg=' + bg;
  });
  t('tokens: spacing, motion, hover, scrollbar vocabulary present', function () {
    return ['--ttm-spacing-md', '--ttm-transition-fast', '--ttm-anim-flash',
            '--ttm-anim-pulse', '--ttm-pink-hover',
            '--ttm-scrollbar-thumb', '--ttm-font-voice'].every(function (v) { return cssVar(v) !== ''; })
      ? true : 'missing token group';
  });
  t('theme: terminal palette identical across all three spec selectors', function () {
    var probe = document.createElement('div');
    document.body.appendChild(probe);
    var got = ['terminal', null, null].map(function (cls, i) {
      probe.removeAttribute('class'); probe.removeAttribute('data-theme');
      probe.removeAttribute('data-ttm-theme');
      if (i === 0) probe.className = 'terminal';
      if (i === 1) probe.setAttribute('data-theme', 'terminal');
      if (i === 2) probe.setAttribute('data-ttm-theme', 'terminal');
      return cssVar('--ttm-bg', probe) + '/' + cssVar('--ttm-pink-hover', probe);
    });
    probe.remove();
    return got[0] === got[1] && got[1] === got[2] && got[0].indexOf('#f2ede1') === 0
      ? true : got.join(' | ');
  });
  t('theme: zine palette distinct from dark and terminal', function () {
    var probe = document.createElement('div');
    document.body.appendChild(probe);
    var read = function (attr) {
      if (attr) probe.setAttribute('data-ttm-theme', attr);
      else probe.removeAttribute('data-ttm-theme');
      return cssVar('--ttm-bg', probe) + '/' + cssVar('--ttm-control', probe);
    };
    var dark = read('ttm'), term = read('terminal'), zine = read('zine');
    probe.remove();
    return zine !== dark && zine !== term && zine.indexOf('#ffffff') === 0
      ? true : 'dark=' + dark + ' term=' + term + ' zine=' + zine;
  });
  t('theme: zine palette identical across all three spec selectors', function () {
    var probe = document.createElement('div');
    document.body.appendChild(probe);
    var got = [0, 1, 2].map(function (i) {
      probe.removeAttribute('class'); probe.removeAttribute('data-theme');
      probe.removeAttribute('data-ttm-theme');
      if (i === 0) probe.className = 'zine';
      if (i === 1) probe.setAttribute('data-theme', 'zine');
      if (i === 2) probe.setAttribute('data-ttm-theme', 'zine');
      return cssVar('--ttm-bg', probe) + '/' + cssVar('--ttm-pink-hover', probe);
    });
    probe.remove();
    return got[0] === got[1] && got[1] === got[2] && got[0].indexOf('#ffffff') === 0
      ? true : got.join(' | ');
  });
  t('modes: every theme renders distinct light and dark grounds', function () {
    var probe = document.createElement('div');
    document.body.appendChild(probe);
    var fails = [];
    window.TTMTheme.THEMES.forEach(function (th) {
      probe.setAttribute('data-ttm-theme', th);
      probe.setAttribute('data-ttm-mode', 'light');
      var light = cssVar('--ttm-bg', probe);
      probe.setAttribute('data-ttm-mode', 'dark');
      var dark = cssVar('--ttm-bg', probe);
      if (!light || !dark || light === dark) fails.push(th + ': light=' + light + ' dark=' + dark);
    });
    probe.remove();
    return fails.length === 0 ? true : fails.join('; ');
  });
  t('modes: TTMTheme exposes mode/setMode/MODES; chrome carries the toggle', function () {
    var T = window.TTMTheme;
    return typeof T.mode === 'function' && typeof T.setMode === 'function' &&
      Array.isArray(T.MODES) && T.MODES.length === 2 &&
      document.querySelector('.ttm-modetoggle') !== null
      ? true : 'mode API or chrome toggle missing';
  });
  t('modes: the header toggle flips the resolved mode', function () {
    var root = document.documentElement;
    var before = root.getAttribute('data-ttm-mode');
    document.querySelector('.ttm-modetoggle').click();
    var flipped = root.getAttribute('data-ttm-mode');
    window.TTMTheme.setMode('dark'); // restore the bench pin
    return before !== flipped ? true : 'stuck at ' + before;
  });
  t('keys: t cycles the theme world site-wide (capture, consumed)', function () {
    var before = window.TTMTheme.current();
    var e = new KeyboardEvent('keydown', { key: 't', bubbles: true, cancelable: true });
    document.dispatchEvent(e);
    var after = window.TTMTheme.current();
    var consumed = e.defaultPrevented;
    window.TTMTheme.set('ttm'); // restore the bench baseline
    return consumed && after !== before ? true :
      'consumed=' + consumed + ' ' + before + '→' + after;
  });
  t('keys: m flips light/dark site-wide (capture, consumed)', function () {
    var root = document.documentElement;
    var before = root.getAttribute('data-ttm-mode');
    var e = new KeyboardEvent('keydown', { key: 'm', bubbles: true, cancelable: true });
    document.dispatchEvent(e);
    var after = root.getAttribute('data-ttm-mode');
    var consumed = e.defaultPrevented;
    window.TTMTheme.setMode('dark'); // restore the bench pin
    return consumed && after !== before ? true :
      'consumed=' + consumed + ' ' + before + '→' + after;
  });
  t('keys: chrome controls carry aria-keyshortcuts', function () {
    var toggle = document.querySelector('.ttm-modetoggle');
    var burger = document.querySelector('.ttm-burger');
    return toggle && toggle.getAttribute('aria-keyshortcuts') === 'm' &&
      burger && !!burger.getAttribute('aria-keyshortcuts')
      ? true : 'aria-keyshortcuts missing';
  });
  t('theme.js: burger menu injected with theme radios', function () {
    return document.querySelector('.ttm-burger') !== null &&
           document.querySelectorAll('.ttm-menu__theme input').length >= 2;
  });
  t('chrome: universal sitebar is pure chrome — no text, nav lives in the menu', function () {
    var bar = document.querySelector('.ttm-sitebar');
    if (!bar) return 'no .ttm-sitebar';
    var barText = bar.textContent.trim();
    var inlineNav = bar.querySelector('nav');
    var menuRoutes = document.querySelectorAll('.ttm-menu nav a.ttm-menu__item[href]');
    return barText === '' && !inlineNav && menuRoutes.length >= 5
      ? true : 'barText="' + barText + '" inlineNav=' + !!inlineNav + ' menuRoutes=' + menuRoutes.length;
  });
  t('chrome: mode toggle and burger live in the sitebar, after the skip link', function () {
    var tools = document.querySelector('.ttm-sitebar__tools');
    var inBar = tools && tools.contains(document.querySelector('.ttm-modetoggle')) &&
      tools.contains(document.querySelector('.ttm-burger'));
    var skip = document.querySelector('.ttm-skip');
    var ordered = skip && (skip.compareDocumentPosition(document.querySelector('.ttm-sitebar')) &
      Node.DOCUMENT_POSITION_FOLLOWING) !== 0;
    return inBar && ordered ? true : 'inBar=' + !!inBar + ' skipFirst=' + !!ordered;
  });

  // ── WCAG 2.1 contrast (the W3C check) ─────────────────────────────────────
  // resolve any token (including var() chains) to rgb via a live probe
  function resolveColor(token, themeAttr, modeAttr) {
    var probe = document.createElement('span');
    if (themeAttr) probe.setAttribute('data-ttm-theme', themeAttr);
    if (modeAttr) probe.setAttribute('data-ttm-mode', modeAttr);
    probe.style.color = 'var(' + token + ')';
    document.body.appendChild(probe);
    var rgb = getComputedStyle(probe).color.match(/\d+(\.\d+)?/g).map(Number);
    probe.remove();
    return rgb;
  }
  function luminance(rgb) {
    var c = rgb.slice(0, 3).map(function (v) {
      v /= 255;
      return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }
  function contrast(a, b) {
    var la = luminance(a), lb = luminance(b);
    return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
  }
  var AA_PAIRS = [
    ['--ttm-text', '--ttm-bg'],
    ['--ttm-text', '--ttm-surface'],
    ['--ttm-text-secondary', '--ttm-surface'],
    ['--ttm-text-muted', '--ttm-surface'],
    ['--ttm-on-accent', '--ttm-accent-cta'],
    ['--ttm-success', '--ttm-bg'],
    ['--ttm-danger', '--ttm-bg'],
    ['--ttm-warning', '--ttm-bg'],
    ['--ttm-info', '--ttm-bg']
  ];
  // WCAG 1.4.11 non-text: 3:1 for interactive chrome. Borders are exempt by
  // design: cards/dividers are decorative, and inputs are identified by
  // background + label, not border alone.
  var UI_PAIRS = [
    ['--ttm-control', '--ttm-bg'],
    ['--ttm-focus', '--ttm-bg']
  ];
  window.TTMTheme.THEMES.reduce(function (acc, th) {
    return acc.concat([[th, 'dark'], [th, 'light']]);
  }, []).forEach(function (combo) {
    var theme = combo[0], mode = combo[1];
    var label = theme + ' · ' + mode;
    t('wcag: AA 4.5:1 for all text/status pairs — ' + label, function () {
      var fails = [];
      AA_PAIRS.forEach(function (p) {
        var r = contrast(resolveColor(p[0], theme, mode), resolveColor(p[1], theme, mode));
        if (r < 4.5) fails.push(p[0] + ' on ' + p[1] + ' = ' + r.toFixed(2));
      });
      return fails.length === 0 ? true : fails.join('; ');
    });
    t('wcag: 3:1 for interactive chrome (1.4.11) — ' + label, function () {
      var fails = [];
      UI_PAIRS.forEach(function (p) {
        var r = contrast(resolveColor(p[0], theme, mode), resolveColor(p[1], theme, mode));
        if (r < 3) fails.push(p[0] + ' on ' + p[1] + ' = ' + r.toFixed(2));
      });
      return fails.length === 0 ? true : fails.join('; ');
    });
  });

  // ── whitelabel runtime (TTMTheme) ─────────────────────────────────────────
  t('whitelabel: TTMTheme API surface complete', function () {
    var T = window.TTMTheme;
    return T && ['apply', 'set', 'current', 'THEMES', 'getCustom', 'setCustom',
      'resetCustom'].every(function (k) { return k in T; }) ? true : 'missing keys';
  });
  t('whitelabel: setCustom applies + persists a valid token override', function () {
    window.TTMTheme.setCustom({ '--ttm-pink': '#123456' });
    var applied = document.documentElement.style.getPropertyValue('--ttm-pink') === '#123456';
    var stored = (window.TTMTheme.getCustom() || {})['--ttm-pink'] === '#123456';
    window.TTMTheme.resetCustom();
    var cleared = document.documentElement.style.getPropertyValue('--ttm-pink') === '';
    return applied && stored && cleared ? true :
      'applied=' + applied + ' stored=' + stored + ' cleared=' + cleared;
  });
  t('whitelabel: overrides outside --ttm/--z/--radius are rejected', function () {
    window.TTMTheme.setCustom({ 'background-image': 'url(x)', '--evil-token': 'red' });
    var root = document.documentElement.style;
    var ok = root.getPropertyValue('background-image') === '' &&
             root.getPropertyValue('--evil-token') === '';
    window.TTMTheme.resetCustom();
    return ok ? true : 'invalid key leaked through';
  });
  t('whitelabel: set() persists and applies a theme', function () {
    var before = localStorage.getItem('ttm_theme');
    var ok = window.TTMTheme.set('terminal') === true &&
             document.documentElement.getAttribute('data-ttm-theme') === 'terminal' &&
             localStorage.getItem('ttm_theme') === 'terminal' &&
             window.TTMTheme.set('bogus') === false;
    if (before === null) localStorage.removeItem('ttm_theme');
    else localStorage.setItem('ttm_theme', before);
    window.TTMTheme.apply('ttm');
    return ok ? true : 'set() broken';
  });

  // ── whitelabel loader (TTMBrand) ──────────────────────────────────────────
  t('brand.js: TTMBrand API surface complete', function () {
    var B = window.TTMBrand;
    return B && ['ready', 'get', 'refresh'].every(function (k) { return typeof B[k] === 'function'; })
      ? true : 'missing keys';
  });
  t('brand.js: fail-soft defaults without Supabase', function () {
    var b = window.TTMBrand.get('brand'), g = window.TTMBrand.get('gate'), th = window.TTMBrand.get('theme');
    return b && b.footer_name === '' && g && g.enabled === true &&
           th && typeof th.tokens === 'object' ? true : 'defaults wrong';
  });
  t('brand.js: contact section defaults (email/website/socials, all empty)', function () {
    var c = window.TTMBrand.get('contact');
    return c && ['email', 'website', 'github', 'mastodon', 'bluesky', 'x']
      .every(function (k) { return c[k] === ''; }) ? true : JSON.stringify(c);
  });
  t('menu: contact block exists and stays hidden while unconfigured', function () {
    var nav = document.querySelector('.ttm-menu__contactnav');
    return nav !== null && nav.hidden === true ? true :
      'nav=' + !!nav + ' hidden=' + (nav && nav.hidden);
  });
  t('brand.js: gate copy is the hook stack.js reads', function () {
    var g = window.TTMBrand.get('gate');
    return typeof g.title === 'string' && typeof g.body === 'string' &&
           typeof g.fine === 'string' ? true : 'gate copy shape wrong';
  });

  t('open source: chrome is unbranded by default', function () {
    // identity may only arrive via site config — never hardcoded in the app
    var name = 'thetech' + 'margin';
    var badge = document.querySelector('.ttm-footer-badge');
    var chrome = (badge ? badge.textContent : '') + ' ' +
                 document.querySelector('.ttm-header').textContent + ' ' + document.title;
    return chrome.toLowerCase().indexOf(name) === -1 ? true : 'brand leaked into chrome';
  });

  // ── toasts ────────────────────────────────────────────────────────────────
  t('toast.js: TTMToast.show renders a toast element', function () {
    if (!window.TTMToast || typeof TTMToast.show !== 'function') return 'TTMToast missing';
    TTMToast.show('test bench toast');
    return document.body.lastElementChild !== null &&
           /toast/i.test(document.body.innerHTML) ? true : 'no toast in DOM';
  });

  // ── stack: config, gate, telemetry (local-only) ───────────────────────────
  t('config.js: placeholders resolve to local-only mode', function () {
    var c = window.TTM_CONFIG;
    return c && c.supabaseUrl === '' && c.supabaseAnonKey === '' ? true
      : 'supabaseUrl=' + JSON.stringify(c && c.supabaseUrl);
  });
  t('stack.js: TTMStack API surface complete', function () {
    var s = window.TTMStack;
    return s && ['track', 'flush', 'visitor', 'isAdmin', 'supabase', 'sessionId']
      .every(function (k) { return k in s; }) ? true : 'missing keys';
  });
  t('stack.js: no Supabase client without credentials', function () {
    return window.TTMStack.supabase() === null || window.TTMStack.supabase() === undefined;
  });
  t('stack.js: telemetry track() is fail-soft locally', function () {
    window.TTMStack.track('test_bench_ping', { ok: 1 });
    window.TTMStack.flush();
    return true;
  });
  t('stack.js: sessionId issued', function () {
    var id = window.TTMStack.sessionId;
    return typeof id === 'string' && id.length > 0 ? true : String(id);
  });
  t('gate: shown on load, or honors ?nogate=1', function () {
    var skipped = new URLSearchParams(location.search).has('nogate');
    var gate = document.querySelector('.ttm-gate, [class*="gate"]');
    var signed = !!window.TTMStack.visitor();
    return skipped || gate !== null || signed ? true : 'no gate, not signed, not skipped';
  });

  // ── sensor core (parse.js) ────────────────────────────────────────────────
  var P = window.OHMParse;
  t('parse: num handles display strings', function () {
    return P.num('1,234 RPM') === 1234 && P.num('52.0 °C') === 52 &&
           P.num('-12.5 W') === -12.5 && P.num('') === null ? true : 'bad parse';
  });
  t('parse: categoryOf reads the icon', function () {
    return P.categoryOf({ ImageURL: 'images_icon/temperature.png' }) === 'temperature' &&
           P.categoryOf({ ImageURL: 'images/transparent.png' }) === null ? true : 'bad category';
  });
  var demoBlocks = P.flatten(window.OHM_DEMO());
  t('parse: flatten finds 5 hardware blocks in the demo tree', function () {
    return demoBlocks.length === 5 ? true : 'blocks=' + demoBlocks.length;
  });
  t('parse: flatten finds all 32 demo sensors (incl. sub-hardware)', function () {
    var n = demoBlocks.reduce(function (a, b) { return a + b.sensors.length; }, 0);
    return n === 32 ? true : 'sensors=' + n;
  });
  t('parse: stateOf thresholds (temp 70/85, load 80/95)', function () {
    return P.stateOf({ cat: 'temperature', n: 85 }) === 'hot' &&
           P.stateOf({ cat: 'temperature', n: 70 }) === 'warn' &&
           P.stateOf({ cat: 'load', n: 95 }) === 'hot' &&
           P.stateOf({ cat: 'load', n: 80 }) === 'warn' &&
           P.stateOf({ cat: 'fan', n: 9999 }) === '' &&
           P.stateOf({ cat: 'temperature', n: null }) === '' ? true : 'bad state';
  });
  t('parse: meterPct clamps load and scales min..max', function () {
    return P.meterPct({ cat: 'load', value: '120 %', n: 120 }) === 100 &&
           P.meterPct({ cat: 'clock', value: '50 MHz', n: 50, nMin: 0, nMax: 100 }) === 50 &&
           P.meterPct({ cat: 'clock', value: '', n: null }) === null ? true : 'bad meter';
  });
  // ── GUI core (gui-core.js) — the desktop features as pure logic ──────────
  var G = window.OHMGui;
  t('gui: Fahrenheit is a display transform on temperature strings only', function () {
    return G.toDisplay('52.0 °C', 'f') === '125.6 °F' &&
           G.toDisplay('-10.0 °C', 'f') === '14.0 °F' &&
           G.toDisplay('1,234 RPM', 'f') === '1,234 RPM' &&
           G.toDisplay('52.0 °C', 'c') === '52.0 °C'
      ? true : 'bad conversion';
  });
  t('gui: report is deterministic and carries values with min/max', function () {
    var r1 = G.report(window.OHM_DEMO(42), 'T0');
    var r2 = G.report(window.OHM_DEMO(42), 'T0');
    return r1 === r2 && r1.indexOf('Open Hardware Monitor Report') === 0 &&
           /\+- .+ : .+ \(min .+ \/ max .+\)/.test(r1)
      ? true : 'report unstable or missing columns';
  });
  t('gui: prefs round-trip through an injected store; toggleIn flips membership', function () {
    var fake = (function () { var m = {}; return {
      getItem: function (k) { return m[k] || null; },
      setItem: function (k, v) { m[k] = String(v); } }; })();
    var p = G.makePrefs(fake);
    p.set({ unit: 'f', cols: { value: true, min: false, max: true } });
    var on = p.toggleIn('plotted', 'a/b/c');
    var off = p.toggleIn('hidden', 'x') && !p.toggleIn('hidden', 'x');
    var g = p.get();
    return g.unit === 'f' && g.cols.min === false && on === true &&
           g.plotted.indexOf('a/b/c') === 0 && off && g.hidden.length === 0
      ? true : JSON.stringify(g);
  });
  t('gui: column class maps visible columns to the grid template', function () {
    return G.colsClass({ value: true, min: true, max: true }) === 'gui-cols-6' &&
           G.colsClass({ value: true, min: false, max: false }) === 'gui-cols-4' &&
           G.colsClass({ value: false, min: false, max: false }) === 'gui-cols-3'
      ? true : 'bad mapping';
  });
  // ── feed (feed.js) — demo is a source on the app's own path ──────────────
  t('feed: read() resolves demo and live through one promise contract', function () {
    var F = window.OHMFeed;
    if (!F || typeof F.read !== 'function') return 'OHMFeed.read missing';
    var demo = F.read({ mode: 'demo' });
    var none = F.read({ mode: 'none' });
    var isPromise = demo && typeof demo.then === 'function' &&
      none && typeof none.then === 'function';
    none.catch(function () {}); // handled: this assertion only checks the shape
    return isPromise ? true : 'read() must always return a promise';
  });
  t('feed: demo reads the app tree parse.js consumes (no separate shape)', function () {
    return window.OHMFeed.read({ mode: 'demo' }).then(function (root) {
      var blocks = window.OHMParse.flatten(root);
      return blocks.length >= 1 && blocks[0].sensors.length >= 1;
    });
  });
  t('feed: source precedence — explicit demo, else saved machine, else none', function () {
    var F = window.OHMFeed, prevMode = null, prevUrl = null;
    try {
      prevMode = localStorage.getItem('ohm_mode');
      prevUrl = localStorage.getItem('ohm_src_url');
      localStorage.removeItem('ohm_mode');
      localStorage.removeItem('ohm_src_url');
      var none = F.resolve().mode;
      localStorage.setItem('ohm_src_url', 'machine:8085');
      var live = F.resolve();
      localStorage.setItem('ohm_mode', 'demo');
      var demo = F.resolve().mode;
      return none === 'none' && live.mode === 'live' &&
        live.url === 'http://machine:8085/data.json' && demo === 'demo'
        ? true : none + '/' + live.mode + '/' + live.url + '/' + demo;
    } finally {
      try {
        prevMode === null ? localStorage.removeItem('ohm_mode')
          : localStorage.setItem('ohm_mode', prevMode);
        prevUrl === null ? localStorage.removeItem('ohm_src_url')
          : localStorage.setItem('ohm_src_url', prevUrl);
      } catch (e) {}
    }
  });

  t('gui: family is shared components — inline gadget modifier, series ink', function () {
    var g = document.createElement('aside');
    g.className = 'ttm-gadget ttm-gadget--inline';
    var chip = document.createElement('span');
    chip.className = 'ttm-plotchip plot-s0';
    var ref = document.createElement('span');
    ref.style.color = 'var(--ttm-pink)';
    document.body.appendChild(g); document.body.appendChild(chip); document.body.appendChild(ref);
    var pos = getComputedStyle(g).position;
    var ink = getComputedStyle(chip).color === getComputedStyle(ref).color;
    g.remove(); chip.remove(); ref.remove();
    return pos === 'static' && ink ? true : 'pos=' + pos + ' seriesInk=' + ink;
  });

  t('parse: app fidelity — min/max carried, ungrouped leaf sensors kept', function () {
    var carried = demoBlocks.every(function (b) {
      return b.sensors.every(function (s) { return 'min' in s && 'max' in s; });
    });
    // a leaf sensor directly under hardware (no type group) must not drop
    var loose = P.flatten({ Children: [{ Text: 'M', Children: [{
      Text: 'HW', ImageURL: 'images_icon/cpu.png', Children: [{
        Text: 'Direct', ImageURL: 'images_icon/temperature.png', Children: [],
        Min: '1.0 V', Value: '1.2 V', Max: '1.3 V' }] }] }] });
    var kept = loose.length === 1 && loose[0].sensors.length === 1 &&
      loose[0].sensors[0].min === '1.0 V' && loose[0].sensors[0].group === '';
    return carried && kept ? true : 'carried=' + carried + ' kept=' + kept;
  });

  // ── demo data + fixtures ──────────────────────────────────────────────────
  t('demo: seeded OHM_DEMO is deterministic', function () {
    return JSON.stringify(window.OHM_DEMO(42)) === JSON.stringify(window.OHM_DEMO(42)) &&
           JSON.stringify(window.OHM_DEMO(42)) !== JSON.stringify(window.OHM_DEMO(7))
      ? true : 'seeding broken';
  });
  t('fixture: frozen tree matches OHM_DEMO(42)', function () {
    return JSON.stringify(window.OHM_FIXTURE) === JSON.stringify(window.OHM_DEMO(42))
      ? true : 'fixture drifted — regenerate per its header comment';
  });
  t('fixture: parses to the canonical 5 blocks / 32 sensors', function () {
    var bl = P.flatten(window.OHM_FIXTURE);
    var n = bl.reduce(function (a, b) { return a + b.sensors.length; }, 0);
    return bl.length === 5 && n === 32 ? true : 'blocks=' + bl.length + ' sensors=' + n;
  });

  t('parse: summarize distills the fixture (machine, counts, hottest, load)', function () {
    var m = P.summarize(window.OHM_FIXTURE);
    var manualHot = null;
    P.flatten(window.OHM_FIXTURE).forEach(function (b) {
      b.sensors.forEach(function (s) {
        if (s.cat === 'temperature' && s.n != null && (!manualHot || s.n > manualHot)) manualHot = s.n;
      });
    });
    return m.machine === 'FORGE-01' && m.blocks === 5 && m.sensors === 32 &&
           m.fans === 3 && typeof m.active === 'boolean' &&
           m.hottest && m.hottest.n === manualHot && m.maxLoad && m.maxLoad.n > 0
      ? true : JSON.stringify(m).slice(0, 120);
  });
  t('parse: summarize survives an empty tree', function () {
    var m = P.summarize({ Children: [] });
    return m.machine === 'machine' && m.blocks === 0 && m.sensors === 0 &&
           m.hottest === null && m.maxLoad === null && m.active === false
      ? true : JSON.stringify(m);
  });

  // ── map bridge (bridge.js) ────────────────────────────────────────────────
  var frag = window.OHMBridge.fragment(window.OHM_DEMO());
  t('bridge: SpaceAPI v14 envelope', function () {
    return Array.isArray(frag.api_compatibility) && frag.api_compatibility[0] === '14' &&
           frag.space === 'FORGE-01' && typeof frag.state.open === 'boolean' &&
           typeof frag['x-source'] === 'string' ? true : 'bad envelope';
  });
  t('bridge: 7 temperatures + 3 fans from the demo tree', function () {
    var tn = frag.sensors.temperature.length, fn = frag.sensors.fan_speed.length;
    return tn === 7 && fn === 3 ? true : 'temps=' + tn + ' fans=' + fn;
  });
  t('bridge: sensor entries carry machine/hardware location', function () {
    var s = frag.sensors.temperature[0];
    return s && /^FORGE-01 \//.test(s.location) && typeof s.value === 'number' &&
           s.unit === '°C' ? true : JSON.stringify(s);
  });
  t('bridge: json() emits parseable pretty JSON', function () {
    var doc = JSON.parse(window.OHMBridge.json(window.OHM_DEMO()));
    return doc.space === 'FORGE-01' ? true : 'roundtrip failed';
  });
  t('bridge: Four Corners attribution present with honest defaults', function () {
    var f = window.OHMBridge.fragment(window.OHM_FIXTURE).ext_fourcorners;
    return f && f.authorship && /FORGE-01/.test(f.authorship.credit) &&
           f.backstory && /Open Hardware Monitor/.test(f.backstory.text) &&
           f.imagery && Array.isArray(f.imagery.media) &&
           f.links && Array.isArray(f.links.links) ? true : JSON.stringify(f);
  });
  t('bridge: meta merges — url/location, Four Corners corners, logo', function () {
    var doc = window.OHMBridge.fragment(window.OHM_FIXTURE, {
      url: 'https://lab.example', location: { lat: 51.05, lon: 3.72 },
      image: { static: 'https://lab.example/machine.jpg' },
      fourCorners: { authorship: { credit: 'Sonia / TTM', license: 'CC BY-SA 4.0' } }
    });
    return doc.url === 'https://lab.example' && doc.location.lat === 51.05 &&
           doc.logo === 'https://lab.example/machine.jpg' &&
           doc.ext_fourcorners.authorship.credit === 'Sonia / TTM' &&
           /Open Hardware Monitor/.test(doc.ext_fourcorners.backstory.text)
      ? true : 'merge broken';
  });
  t('bridge: capabilities become Wikidata IRIs in ext_tags; absent without meta', function () {
    var doc = window.OHMBridge.fragment(window.OHM_FIXTURE, {
      capabilities: ['Q332988', 'http://www.wikidata.org/entity/Q685', 'not-a-qid']
    });
    var bare = window.OHMBridge.fragment(window.OHM_FIXTURE, {});
    return doc.ext_tags && doc.ext_tags.length === 2 &&
           doc.ext_tags[0] === 'http://www.wikidata.org/entity/Q332988' &&
           doc.ext_tags[1] === 'http://www.wikidata.org/entity/Q685' &&
           !('ext_tags' in bare) ? true : JSON.stringify(doc.ext_tags);
  });
  t('bridge: OKW equipment passes through as ext_okw.equipment', function () {
    var eq = [{ equipment_type: 'http://www.wikidata.org/entity/Q332988',
                make: 'Epilog', model: 'Fusion Pro', laser_power: 120 }];
    var doc = window.OHMBridge.fragment(window.OHM_FIXTURE, { equipment: eq });
    var bare = window.OHMBridge.fragment(window.OHM_FIXTURE, {});
    return doc.ext_okw && doc.ext_okw.equipment[0].make === 'Epilog' &&
           doc.ext_okw.equipment[0].laser_power === 120 &&
           !('ext_okw' in bare) ? true : JSON.stringify(doc.ext_okw);
  });
  t('bridge: IIIF ImageService3 block well-formed when meta provides a service', function () {
    var doc = window.OHMBridge.fragment(window.OHM_FIXTURE,
      { image: { iiif: 'https://iiif.example/machine' } });
    var s = doc.ext_iiif;
    var none = window.OHMBridge.fragment(window.OHM_FIXTURE, {});
    return s && s['@context'] === 'http://iiif.io/api/image/3/context.json' &&
           s.id === 'https://iiif.example/machine' && s.type === 'ImageService3' &&
           s.profile === 'level1' && !('ext_iiif' in none) ? true : JSON.stringify(s);
  });

  // ── keyboard shortcuts + accessible navigation (theme.js) ────────────────
  t('a11y: skip link is the first tab stop and targets #main', function () {
    var skip = document.body.querySelector('a, button, input, [tabindex]');
    var main = document.getElementById('main');
    return skip && skip.classList.contains('ttm-skip') &&
           skip.getAttribute('href') === '#main' &&
           main !== null && main.getAttribute('tabindex') === '-1'
      ? true : 'skip=' + (skip && skip.className) + ' main=' + !!main;
  });
  t('a11y: skip link hidden off-screen until focused', function () {
    var cs = getComputedStyle(document.querySelector('.ttm-skip'));
    return cs.position === 'fixed' && cs.transform !== 'none' ? true :
      'position=' + cs.position + ' transform=' + cs.transform;
  });
  t('nav: TTMNav API surface complete', function () {
    var N = window.TTMNav;
    return N && ['d', 'r', 't', 'a', 'm', 'p'].every(function (k) { return k in N.routes; }) &&
           typeof N.chordPending === 'function' && typeof N.openMenu === 'function' &&
           typeof N.closeMenu === 'function' && typeof N.menuOpen === 'function'
      ? true : 'missing keys';
  });
  t('nav: g arms the chord, a non-route key disarms it', function () {
    // 'q' maps to no route, so this never navigates away from the bench
    document.dispatchEvent(new KeyboardEvent('keydown', { key: 'g', bubbles: true }));
    var armed = window.TTMNav.chordPending();
    document.dispatchEvent(new KeyboardEvent('keydown', { key: 'q', bubbles: true }));
    var disarmed = !window.TTMNav.chordPending();
    return armed && disarmed ? true : 'armed=' + armed + ' disarmed=' + disarmed;
  });
  t('nav: chord prefix is consumed — page handlers see it defaultPrevented', function () {
    var e = new KeyboardEvent('keydown', { key: 'g', bubbles: true, cancelable: true });
    document.dispatchEvent(e);
    var claimed = e.defaultPrevented;
    document.dispatchEvent(new KeyboardEvent('keydown', { key: 'q', bubbles: true }));
    return claimed ? true : 'g not consumed by capture handler';
  });
  t('nav: menu opens with focus inside, closes back to the burger', function () {
    var N = window.TTMNav;
    N.openMenu();
    var opened = N.menuOpen() &&
      document.getElementById('ttm-menu').contains(document.activeElement);
    N.closeMenu();
    var closed = !N.menuOpen() &&
      document.activeElement === document.querySelector('.ttm-burger');
    // This test parked the browser's sequential-focus starting point on the
    // burger (blur alone does not clear it), which would send the visitor's
    // first Tab into the page tail instead of the skip link. A transient
    // sentinel at the top of body resets the starting point to document start.
    var sentinel = document.createElement('span');
    sentinel.tabIndex = -1;
    document.body.insertBefore(sentinel, document.body.firstChild);
    sentinel.focus();
    sentinel.remove();
    return opened && closed ? true : 'opened=' + opened + ' closed=' + closed;
  });

  t('tokenized: legacy unprefixed components are gone (.kv/.bar/.note/table)', function () {
    var host = document.createElement('div');
    host.innerHTML = '<div class="kv"></div><div class="bar"></div><p class="note">x</p><table><tr><td>x</td></tr></table>';
    document.body.appendChild(host);
    var kv = getComputedStyle(host.querySelector('.kv')).display;
    var bar = getComputedStyle(host.querySelector('.bar')).display;
    var td = getComputedStyle(host.querySelector('td')).borderBottomWidth;
    host.remove();
    return kv === 'block' && bar === 'block' && td === '0px'
      ? true : 'kv=' + kv + ' bar=' + bar + ' td-border=' + td;
  });
  t('tokenized: control type rides the scale (buttons = --ttm-fs-small)', function () {
    var b = document.createElement('button');
    b.className = 'ttm-btn-primary';
    document.body.appendChild(b);
    var fs = getComputedStyle(b).fontSize;
    b.remove();
    var expect = getComputedStyle(document.documentElement).getPropertyValue('--ttm-fs-small').trim();
    var px = parseFloat(expect) * 16 + 'px';
    return fs === px ? true : 'button=' + fs + ' token=' + expect;
  });
  // ── overhaul components: stat tiles, sparklines, meter ramps ─────────────
  t('tiles: .ttm-tile carries surface, border and big value type', function () {
    var tile = document.createElement('div'); tile.className = 'ttm-tile';
    tile.innerHTML = '<span class="ttm-tile__label">x</span><b class="ttm-tile__value">1</b>';
    document.body.appendChild(tile);
    var cs = getComputedStyle(tile);
    var vs = getComputedStyle(tile.querySelector('.ttm-tile__value'));
    var ok = cs.borderTopWidth !== '0px' && parseFloat(vs.fontSize) >= 24;
    tile.remove();
    return ok ? true : 'border=' + cs.borderTopWidth + ' value=' + vs.fontSize;
  });
  t('spark: 2px de-emphasis line, status only on the end dot', function () {
    var host = document.createElement('div');
    host.innerHTML = '<svg class="spark"><path class="spark__line" d="M0 0 L10 10"/>' +
      '<circle class="spark__dot spark__dot--hot" r="2.5"/></svg>';
    document.body.appendChild(host);
    var line = getComputedStyle(host.querySelector('.spark__line'));
    var dot = getComputedStyle(host.querySelector('.spark__dot'));
    var textFaint = getComputedStyle(document.documentElement).getPropertyValue('--ttm-text-faint');
    var ok = line.strokeWidth === '2px' && line.fill === 'none' &&
      dot.fill !== '' && dot.fill !== line.stroke;
    host.remove();
    return ok ? true : 'stroke=' + line.strokeWidth + '/' + line.stroke +
      ' dot=' + dot.fill + ' faint=' + textFaint;
  });
  t('meter: the unfilled track tints with the row state (warn/hot ramps)', function () {
    var host = document.createElement('div');
    host.innerHTML =
      '<div class="ttm-sensor"><span class="meterbar"></span></div>' +
      '<div class="ttm-sensor ttm-sensor--hot"><span class="meterbar"></span></div>';
    document.body.appendChild(host);
    var bars = host.querySelectorAll('.meterbar');
    var base = getComputedStyle(bars[0]).backgroundColor;
    var hot = getComputedStyle(bars[1]).backgroundColor;
    host.remove();
    return base !== hot && base !== '' ? true : 'base=' + base + ' hot=' + hot;
  });

  // restore the visitor's own mode choice
  try {
    if (prevMode === null) localStorage.removeItem('ttm_mode');
    else localStorage.setItem('ttm_mode', prevMode);
  } catch (e) {}
  window.TTMTheme.apply(window.TTMTheme.current());

  // ── standardization guard: no page owns styling (async; report waits) ────
  var GUARD_NAME = 'standardized: no page-local <style> or static inline styles anywhere';
  var standardizationSweep = Promise.all(
    ['/index.html', '/rfq/index.html', '/admin/index.html',
     '/components/index.html', '/plot/index.html', '/gadget/index.html',
     '/report/index.html', '/404.html', '/500.html']
    .map(function (u) { return fetch(u).then(function (r) { return r.text(); })
      .then(function (html) {
        var styleBlocks = (html.match(/<style>/g) || []).length;
        var inline = (html.match(/ style="/g) || []).length;
        var dataDriven = (html.match(/ style="width:/g) || []).length;
        return { u: u, blocks: styleBlocks, inline: inline - dataDriven };
      }); }))
    .then(function (pages) {
      var bad = pages.filter(function (p) { return p.blocks > 0 || p.inline > 0; });
      results.push({ name: GUARD_NAME, ok: bad.length === 0,
        detail: bad.length ? JSON.stringify(bad) : '' });
    })
    .catch(function () {
      results.push({ name: GUARD_NAME, ok: true, detail: 'file:// mode — fetch unavailable, skipped' });
    });

  Promise.all([standardizationSweep].concat(pending)).then(function () {
    // ── report ────────────────────────────────────────────────────────────────
    var tbl = document.getElementById('results');
    results.forEach(function (r) {
      var tr = document.createElement('tr');
      tr.innerHTML = '<td class="' + (r.ok ? 'ttm-pass' : 'ttm-fail') + '">' + (r.ok ? 'PASS' : 'FAIL') +
        '</td><td>' + r.name + '</td><td class="mono">' + (r.detail || '') + '</td>';
      tbl.appendChild(tr);
    });
    var passed = results.filter(function (r) { return r.ok; }).length;
    var badge = document.getElementById('summary');
    badge.textContent = passed + '/' + results.length + (passed === results.length ? ' ✓' : ' ✗');
    window.__TTM_TEST_RESULTS = { passed: passed, total: results.length, results: results };
  });
});
</script>
</body>
</html>
