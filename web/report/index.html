<!doctype html>
<html lang="en" data-ttm-theme="ttm">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Report — Hardware</title>
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-icon.png" />
<link rel="stylesheet" href="/ttm/tokens.css" />
<link rel="stylesheet" href="/ttm/components.css" />
<script src="/ttm/config.js"></script>
<script src="/vendor/supabase.js"></script>
<script src="/ttm/theme.js"></script>
<script src="/ttm/brand.js"></script>
<script src="/ttm/toast.js"></script>
<script src="/ttm/stack.js"></script>
</head>
<body class="ttm-page">
<a class="ttm-skip" href="#main">Skip to content</a>
<main class="ttm-main" id="main" tabindex="-1">
  <header class="ttm-header">
    <h1>Report <span class="gradient-text-rainbow">· hardware snapshot</span></h1>
    <span class="ttm-crumb">the app's Save Report — the whole tree as plain text</span>
    <span class="ttm-badge" id="status" role="status" aria-live="polite">idle</span>
  </header>

  <section class="ttm-card full" aria-labelledby="h-report">
    <h2 class="ttm-card__title" id="h-report">Report</h2>
    <div class="ttm-row">
      <button class="ttm-btn-primary" id="download">Download .txt</button>
      <button class="ttm-btn-outline" id="copy">Copy</button>
    </div>
    <pre class="ttm-receipt ttm-gap-top" id="report">— waiting for the feed —</pre>
  </section>

  <footer class="ttm-footer">the report window, served as a route · regenerated on every poll</footer>
</main>

<script src="/parse.js"></script>
<script src="/gui-core.js"></script>
<script src="/demo-data.js"></script>
<script src="/feed.js"></script>
<script src="/report/report.js"></script>
</body>
</html>
